services:

  postgres:
    image: postgres:16
    container_name: dl_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: dladmin
      POSTGRES_PASSWORD: change_this_password
      POSTGRES_DB: digitallinks_ai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  qdrant:
    image: qdrant/qdrant:latest
    container_name: dl_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  backend:
    build:
      context: ./backend
    container_name: dl_backend
    restart: unless-stopped

    env_file:
      - .env

    ports:
      - "8000:8000"

    volumes:
      - ./backend/app:/app/app

    depends_on:
      - postgres
      - qdrant


volumes:
  postgres_data:
  qdrant_data: